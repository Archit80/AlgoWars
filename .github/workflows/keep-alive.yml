# Keeps the Render free instance from sleeping (it spins down after 15 idle minutes) and keeps the
# Supabase free project from pausing (after 7 days without database activity).
# /api/ping-supabase does both in one request: it wakes the backend and runs `SELECT 1`.
#
# This must run outside the backend: a cron inside a sleeping process never fires.
# Note: GitHub can delay scheduled runs under load, and disables schedules after 60 days
# without repository activity (re-enable from the Actions tab).
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend and database
        env:
          # Override with a repository variable if the backend URL changes
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://codeclash-xt7g.onrender.com' }}
        # A cold start can take ~60s, hence the generous timeout and retries
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 15 \
            "$BACKEND_URL/api/ping-supabase"
